# The test suite, the Nix package and the NixOS VM test (runbooks/deploy-nixos.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test_baseline_columns reads db/schema.sql at an old commit
      - name: ffmpeg for the transcription tests
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - uses: astral-sh/setup-uv@v6
      - name: Install from the lock
        run: |
          uv venv -p 3.13 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements.lock
          uv pip install --python .venv/bin/python -r api/requirements-dev.txt
      - name: Test
        run: .venv/bin/python -m pytest -q -o faulthandler_timeout=120

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: nix flake check (x86_64-linux package and VM test)
        run: nix flake check -L --system x86_64-linux
      - name: The aarch64 package evaluates
        # Evaluation only: building it (and so checking its wheelhouse hash)
        # needs an aarch64 builder.
        run: nix eval --raw .#packages.aarch64-linux.q-core.drvPath
